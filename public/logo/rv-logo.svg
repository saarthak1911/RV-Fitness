<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="50%" stop-color="#FFC62A" />
      <stop offset="100%" stop-color="#D49A0B" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7307" />
      <stop offset="35%" stop-color="#FFD65A" />
      <stop offset="70%" stop-color="#FFC62A" />
      <stop offset="100%" stop-color="#846006" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="100" cy="100" r="94" fill="#0A0A0A" />

  <!-- Outer Ring with Gold Accent -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldRing)" stroke-width="3.5" filter="url(#goldGlow)" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FFC62A" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Dumbbell Icon Behind / Center -->
  <g transform="translate(100, 138) scale(0.65)" stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <!-- Center Bar -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke-width="5" stroke-linecap="round" />
    <!-- Center Grip Ridges -->
    <line x1="-12" y1="-3" x2="-12" y2="3" stroke-width="2" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke-width="2" />
    <line x1="12" y1="-3" x2="12" y2="3" stroke-width="2" />
    <!-- Left Weight Plates -->
    <rect x="-42" y="-14" width="7" height="28" rx="2" fill="url(#goldGrad)" />
    <rect x="-49" y="-19" width="6" height="38" rx="2" fill="url(#goldGrad)" />
    <rect x="-55" y="-12" width="5" height="24" rx="2" fill="url(#goldGrad)" />
    <!-- Right Weight Plates -->
    <rect x="35" y="-14" width="7" height="28" rx="2" fill="url(#goldGrad)" />
    <rect x="43" y="-19" width="6" height="38" rx="2" fill="url(#goldGrad)" />
    <rect x="50" y="-12" width="5" height="24" rx="2" fill="url(#goldGrad)" />
  </g>

  <!-- RV Monogram Typography -->
  <!-- R -->
  <path d="M 58 56 L 78 56 C 88 56 94 62 94 70 C 94 77 88 83 79 84 L 95 106 L 82 106 L 68 85 L 68 106 L 58 106 Z M 68 65 L 68 76 L 76 76 C 81 76 84 73 84 70 C 84 67 81 65 76 65 Z"
        fill="url(#goldGrad)" />
  <!-- V -->
  <polygon points="98,56 109,56 123,96 137,56 148,56 129,106 117,106"
           fill="url(#goldGrad)" />

  <!-- Subtitle Text -->
  <text x="100" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
    NARSOBAWADI
  </text>
  <text x="100" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" letter-spacing="4.5" fill="#FFC62A" text-anchor="middle">
    FITNESS
  </text>
</svg>
